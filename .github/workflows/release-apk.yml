name: Release Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Release tags must look like vMAJOR.MINOR.PATCH; got ${tag}"
            exit 1
          fi

          echo "VERSION=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Require release-signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PAPER212_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PAPER212_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PAPER212_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PAPER212_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy `tools` package was removed from the SDK repository.
          # Install only platform-tools here; the next step installs the
          # explicit platform, build-tools, NDK and CMake versions.
          packages: platform-tools

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

          # Android publishes API 37 as the minor-version platform 37.0, while
          # AGP resolves compileSdk 37 to the historical `android-37` directory.
          # Expose the real 37.0 platform under that name without suppressing
          # the AAR metadata/compile-SDK checks.
          if [[ ! -e "$ANDROID_HOME/platforms/android-37" ]]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -f "$ANDROID_HOME/platforms/android-37/source.properties"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run mobile tests
        run: npm test

      - name: Type-check mobile app
        run: npx tsc --noEmit

      - name: Materialize release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PAPER212_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/paper212-release.jks"
          test -s "$RUNNER_TEMP/paper212-release.jks"
          echo "PAPER212_RELEASE_STORE_FILE=$RUNNER_TEMP/paper212-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        shell: bash
        env:
          PAPER212_RELEASE_STORE_PASSWORD: ${{ secrets.PAPER212_KEYSTORE_PASSWORD }}
          PAPER212_RELEASE_KEY_ALIAS: ${{ secrets.PAPER212_KEY_ALIAS }}
          PAPER212_RELEASE_KEY_PASSWORD: ${{ secrets.PAPER212_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease \
            "-Ppaper212VersionName=${VERSION}" \
            "-Ppaper212VersionCode=${VERSION_CODE}"

      - name: Verify signed APK and prepare release asset
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          apksigner="$build_tools/apksigner"
          aapt="$build_tools/aapt"

          "$apksigner" verify --verbose --print-certs "$apk" 2>&1 | tee "$RUNNER_TEMP/apksigner.txt"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/apksigner.txt"
          grep -Eq "^(V2 Signer: certificate DN|Signer #1 certificate DN): .*CN=Paper212(,|$)" "$RUNNER_TEMP/apksigner.txt"

          badging="$("$aapt" dump badging "$apk" | head -n 1)"
          echo "$badging"
          echo "$badging" | grep -q "versionName='${VERSION}'"

          asset="Paper212-${VERSION}-release.apk"
          cp "$apk" "$asset"
          sha256sum "$asset" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "RELEASE_ASSET=${asset}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" "$RELEASE_ASSET" \
            --verify-tag \
            --title "Paper212 ${VERSION}" \
            --generate-notes
